# Forward a published GitHub release to a Telegram channel.
#
# Trigger: when a release is published on this repo (the normal
# v1.1.x release flow), this workflow downloads the release APK
# and sends it to Telegram with the Telegram Bot API, with a
# caption in this style (adopted 2026-11-03, from the next
# version on):
#
#   New release from lengroo/Example
#
#   Version: v1.1.13-<short commit sha> (<versionCode>)
#
#   Commit message:
#   <the release commit's full message, in a code block>
#
# The APK is shown under the name "<app name>（<version>）.apk"
# instead of app-debug.apk.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   TELEGRAM_BOT_TOKEN — the bot token. Never put it in this file.
#   TELEGRAM_CHAT_ID   — the destination channel/chat ID.
#
# The bot token and chat ID are intentionally NOT in this file:
# anyone who can read the repo could otherwise use the bot.
# If either secret is missing, the workflow fails with a clear
# message instead of sending anything.
#
# Manual test: Actions > "Forward release to Telegram" > Run
# workflow, with the tag of an existing release (e.g. v1.1.10).
# That re-sends that release's changelog and APK.

name: Forward release to Telegram

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to forward (e.g. v1.1.10)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "No release tag found." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Check Telegram secrets are set
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "Missing secret: TELEGRAM_BOT_TOKEN. Add it in repo Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          if [ -z "$CHAT_ID" ]; then
            echo "Missing secret: TELEGRAM_CHAT_ID. Add it in repo Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "Telegram secrets are set."

      - name: Download the release APK
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          curl -sSL -o app-debug.apk \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/app-debug.apk"
          ls -lh app-debug.apk
          file app-debug.apk

      - name: Fetch release info
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # No checkout step in this workflow, so gh needs --repo /
          # explicit API paths. One commits call gives both the
          # release commit's SHA and its full message.
          gh api "repos/${REPO}/commits/${TAG}" --jq '.sha' > commit_sha.txt
          gh api "repos/${REPO}/commits/${TAG}" --jq '.commit.message' > commit_message.txt
          gh api "repos/${REPO}/contents/app/build.gradle.kts?ref=${TAG}" --jq '.content' | base64 -d > build-gradle.txt
          grep -oP 'versionCode\s*=\s*\K[0-9]+' build-gradle.txt | head -1 > version_code.txt
          echo "commit: $(cat commit_sha.txt)  versionCode: $(cat version_code.txt)"

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          DISPLAY_NAME="LibXposed Example（${VERSION}）.apk"
          # Build the caption in the adopted style. The commit
          # message goes in a <pre> block (HTML parse mode), so it
          # must be HTML-escaped; keep the whole caption safely
          # under Telegram's 1024-character document caption limit.
          SHORT_SHA="$(cut -c1-7 commit_sha.txt)"
          VERSION_CODE="$(cat version_code.txt)"
          python3 - "$TAG" "$SHORT_SHA" "$VERSION_CODE" "$REPO" <<'PYEOF'
          import html, sys
          tag, short_sha, version_code, repo = sys.argv[1:5]
          message = open('commit_message.txt', encoding='utf-8').read().strip()
          if len(message) > 700:
              message = message[:700].rstrip() + '…'
          caption = (
              f"New release from {repo}\n\n"
              f"Version: {tag}-{short_sha} ({version_code})\n\n"
              f"Commit message:\n"
              f"<pre>{html.escape(message)}</pre>"
          )
          open('caption.txt', 'w', encoding='utf-8').write(caption)
          print(caption)
          PYEOF
          # --fail makes the step fail if Telegram rejects the send.
          curl -sSL --fail -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@app-debug.apk;filename=${DISPLAY_NAME}" \
            -F "parse_mode=HTML" \
            -F "caption=<caption.txt"
